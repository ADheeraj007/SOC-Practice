    const createLucideIcon = (pascalName) => {
      return function LucideIcon({ className = 'w-4 h-4', ...props }) {
        const iconNode = window.lucide && window.lucide.icons ? window.lucide.icons[pascalName] : null;
        if (!iconNode) {
          return (
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="2"
              strokeLinecap="round"
              strokeLinejoin="round"
              className={className}
              {...props}
            >
              <circle cx="12" cy="12" r="9" />
            </svg>
          );
        }

        const renderElement = (node, idx) => {
          if (Array.isArray(node) && typeof node[0] === 'string') {
            const [tag, attrs, children] = node;
            return React.createElement(
              tag,
              { key: idx, ...(attrs || {}) },
              Array.isArray(children) ? children.map(renderElement) : null
            );
          }
          if (node && typeof node === 'object' && typeof node.tag === 'string') {
            return React.createElement(
              node.tag,
              { key: idx, ...(node.attrs || {}) },
              Array.isArray(node.children) ? node.children.map(renderElement) : null
            );
          }
          return null;
        };

        let childrenList = [];
        if (Array.isArray(iconNode)) {
          // Lucide UMD format is often ["svg", { ...attrs }, [ ["path", {...}], ... ]]
          if (typeof iconNode[0] === 'string' && Array.isArray(iconNode[2])) {
            childrenList = iconNode[2];
          } else {
            childrenList = iconNode;
          }
        } else if (iconNode && Array.isArray(iconNode.children)) {
          childrenList = iconNode.children;
        }

        return (
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            strokeWidth="2"
            strokeLinecap="round"
            strokeLinejoin="round"
            className={className}
            {...props}
          >
            {childrenList.map(renderElement)}
          </svg>
        );
      };
    };

    // ============================================================================
    // MAIN APPLICATION COMPONENT
    // ============================================================================
    function App() {
      // Primary View Navigation: 'dashboard' | 'lab' | 'skills' | 'sandbox'
      const [activeView, setActiveView] = useState('dashboard');
      const [activeRoomId, setActiveRoomId] = useState(ROOMS[0].id);
      const [tierFilter, setTierFilter] = useState('ALL');
      const [demoAssist, setDemoAssist] = useState(false);

      // Persistent Operator Profile State
      const [operatorHandle, setOperatorHandle] = useState(() => localStorage.getItem('cyberops_handle') || 'Operator_01');
      const [completedTasks, setCompletedTasks] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('cyberops_range_tasks') || '{}');
        } catch {
          return {};
        }
      });
      const [streakDays, setStreakDays] = useState(() => Number(localStorage.getItem('cyberops_range_streak') || 4));

      // Certificate Modal State
      const [certModalRoom, setCertModalRoom] = useState(null);

      // Active Room Lab State
      const activeRoom = useMemo(() => ROOMS.find((r) => r.id === activeRoomId) || ROOMS[0], [activeRoomId]);
      const [expandedTasks, setExpandedTasks] = useState({ t1: true });
      const [taskInputs, setTaskInputs] = useState({});
      const [taskStatus, setTaskStatus] = useState({});
      const [openHints, setOpenHints] = useState({});
      const [xpToast, setXpToast] = useState(null);

      // Right-Pane Lab Workbench State
      const [labTab, setLabTab] = useState('siem');
      const [siemSearch, setSiemSearch] = useState('');
      const [siemSeverityFilter, setSiemSeverityFilter] = useState('ALL');
      const [inspectedLog, setInspectedLog] = useState(null);

      // Interactive Linux / EDR Terminal State
      const [termHistory, setTermHistory] = useState([]);
      const [termInput, setTermInput] = useState('');
      const [isolatedHosts, setIsolatedHosts] = useState([]);
      const [killedPids, setKilledPids] = useState([]);
      const [blockedIocs, setBlockedIocs] = useState([]);
      const termEndRef = useRef(null);

      // CyberChef-Lite & Threat Intel State
      const [chefOp, setChefOp] = useState('b64_decode');
      const [chefKey, setChefKey] = useState('42');
      const [chefInput, setChefInput] = useState('');
      const [chefOutput, setChefOutput] = useState('');
      const [shaInput, setShaInput] = useState('');
      const [shaOutput, setShaOutput] = useState('');
      const [iocQuery, setIocQuery] = useState('');
      const [iocResult, setIocResult] = useState(null);

      // Sigma Rule & Containment Console State
      const [sigmaField, setSigmaField] = useState('details');
      const [sigmaPattern, setSigmaPattern] = useState('');
      const [sigmaResult, setSigmaResult] = useState(null);

      // Persist user progress to localStorage
      useEffect(() => {
        localStorage.setItem('cyberops_handle', operatorHandle);
        localStorage.setItem('cyberops_range_tasks', JSON.stringify(completedTasks));
        localStorage.setItem('cyberops_range_streak', String(streakDays));
      }, [operatorHandle, completedTasks, streakDays]);

      // Reset lab workbench cleanly when switching rooms
      useEffect(() => {
        setLabTab(activeRoom.defaultTab || 'siem');
        setExpandedTasks({ [activeRoom.tasks[0].id]: true });
        setSiemSearch('');
        setSiemSeverityFilter('ALL');
        setInspectedLog(activeRoom.siemLogs?.[0] || null);
        setIsolatedHosts([]);
        setKilledPids([]);
        setBlockedIocs([]);
        setSigmaField(activeRoom.sigmaTarget?.defaultField || 'details');
        setSigmaPattern(activeRoom.sigmaTarget?.defaultMatch || '');
        setSigmaResult(null);
        setTermHistory([
          { kind: 'sys', text: `Connected to CyberOps Range Target Environment: [${activeRoom.id} — ${activeRoom.title}]` },
          { kind: 'sys', text: `${activeRoom.targetInfo}` },
          { kind: 'sys', text: 'Type "help" for available forensic, Linux, Volatility, and EDR commands.' }
        ]);
      }, [activeRoom]);

      useEffect(() => {
        termEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [termHistory]);

      // CyberChef-Lite live transformation
      useEffect(() => {
        const val = chefInput.trim();
        if (!val) {
          setChefOutput('');
          return;
        }
        try {
          if (chefOp === 'b64_decode') {
            setChefOutput(atob(val).replace(/\u0000/g, ''));
          } else if (chefOp === 'b64_encode') {
            setChefOutput(btoa(val));
          } else if (chefOp === 'hex_decode') {
            const clean = val.replace(/\s+/g, '');
            let out = '';
            for (let i = 0; i < clean.length; i += 2) {
              out += String.fromCharCode(parseInt(clean.substr(i, 2), 16));
            }
            setChefOutput(out);
          } else if (chefOp === 'url_decode') {
            setChefOutput(decodeURIComponent(val));
          } else if (chefOp === 'rot13') {
            setChefOutput(
              val.replace(/[a-zA-Z]/g, (c) =>
                String.fromCharCode((c <= 'Z' ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26)
              )
            );
          } else if (chefOp === 'xor') {
            const k = Number(chefKey) || 0;
            setChefOutput(
              Array.from(val)
                .map((ch) => String.fromCharCode(ch.charCodeAt(0) ^ k))
                .join('')
            );
          }
        } catch {
          setChefOutput('[!] Invalid input format for selected decoder operation.');
        }
      }, [chefInput, chefOp, chefKey]);

      // SHA-256 Web Crypto Generator
      useEffect(() => {
        let active = true;
        async function computeSha() {
          if (!shaInput) {
            setShaOutput('');
            return;
          }
          try {
            const buf = new TextEncoder().encode(shaInput);
            const digest = await crypto.subtle.digest('SHA-256', buf);
            const hex = Array.from(new Uint8Array(digest))
              .map((b) => b.toString(16).padStart(2, '0'))
              .join('');
            if (active) setShaOutput(hex);
          } catch {
            if (active) setShaOutput('SHA-256 unavailable in this browser context.');
          }
        }
        computeSha();
        return () => {
          active = false;
        };
      }, [shaInput]);

      // Compute Progression, XP, Ranks & 5-Domain Skill Matrix
      const stats = useMemo(() => {
        let totalXp = 0;
        const domainXp = { siem: 0, hunting: 0, dfir: 0, network: 0, detection: 0 };
        const domainMax = { siem: 0, hunting: 0, dfir: 0, network: 0, detection: 0 };
        const completedRooms = [];
        let completedTasksCount = 0;

        ROOMS.forEach((room) => {
          domainMax[room.domain] += room.xp;
          let allTasksSolved = true;
          room.tasks.forEach((task) => {
            const key = `${room.id}:${task.id}`;
            if (completedTasks[key]) {
              totalXp += task.xp;
              domainXp[room.domain] += task.xp;
              completedTasksCount++;
            } else {
              allTasksSolved = false;
            }
          });
          if (allTasksSolved) completedRooms.push(room.id);
        });

        const currentRank = [...RANKS].reverse().find((r) => totalXp >= r.minXp) || RANKS[0];
        const nextRank = RANKS.find((r) => r.minXp > totalXp) || null;
        const rankPct = nextRank
          ? Math.min(100, Math.max(4, Math.round(((totalXp - currentRank.minXp) / (nextRank.minXp - currentRank.minXp)) * 100)))
          : 100;

        return { totalXp, domainXp, domainMax, completedRooms, completedTasksCount, currentRank, nextRank, rankPct };
      }, [completedTasks]);

      // Task Flag/Answer Validation
      const handleCheckTask = (room, task, idx) => {
        const key = `${room.id}:${task.id}`;
        const guess = (taskInputs[key] || '').trim();
        if (!guess) return;

        if (guess.toLowerCase() === task.answer.toLowerCase()) {
          const wasAlreadySolved = !!completedTasks[key];
          const nextCompleted = { ...completedTasks, [key]: true };
          setCompletedTasks(nextCompleted);
          setTaskStatus((prev) => ({ ...prev, [key]: { ok: true, msg: `Verified! +${task.xp} XP awarded.` } }));

          if (!wasAlreadySolved) {
            setXpToast(`+${task.xp} XP • ${task.title}`);
            setTimeout(() => setXpToast(null), 3200);
          }

          const nextTask = room.tasks[idx + 1];
          if (nextTask) {
            setExpandedTasks((prev) => ({ ...prev, [nextTask.id]: true }));
          }

          const roomNowComplete = room.tasks.every((t) => nextCompleted[`${room.id}:${t.id}`]);
          if (roomNowComplete && !wasAlreadySolved) {
            setCertModalRoom(room);
          }
        } else {
          setTaskStatus((prev) => ({ ...prev, [key]: { ok: false, msg: 'Incorrect flag or artifact value. Re-check lab telemetry.' } }));
        }
      };

      // Reset all progress
      const handleResetProgress = () => {
        setCompletedTasks({});
        setTaskInputs({});
        setTaskStatus({});
        setCertModalRoom(null);
        localStorage.removeItem('cyberops_range_tasks');
      };

      // Interactive Linux / EDR Terminal Handler
      const handleRunCommand = (e) => {
        e.preventDefault();
        const raw = termInput.trim();
        if (!raw) return;
        setTermInput('');

        const parts = raw.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const arg1 = parts[1] || '';
        const arg2 = parts[2] || '';

        const pushOut = (lines) => {
          setTermHistory((prev) => [
            ...prev,
            { kind: 'cmd', text: `operator@cyberops-range:~$ ${raw}` },
            ...lines.map((line) => ({ kind: 'out', text: line }))
          ]);
        };

        if (cmd === 'help') {
          pushOut([
            'Available Lab & EDR Commands:',
            '  ls                         List mounted forensic evidence files',
            '  find / -name <pattern>     Search virtual filesystem paths',
            '  cat <filepath>             Read file contents (e.g., cat /var/log/auth.log)',
            '  head / tail <filepath>     Show first or last 10 lines of a file',
            '  wc -l <filepath>           Count lines in an evidence file',
            '  grep <term> <filepath>     Search pattern inside evidence file',
            '  awk <pattern> <filepath>   Print matching rows/fields from file',
            '  strings <filepath>         Extract printable strings & carved artifacts',
            '  base64 -d <string>         Decode Base64 string (also supports echo <b64> | base64 -d)',
            '  xxd -r -p <hex>            Decode hex string to ASCII',
            '  sha256sum <filepath>       Display SHA-256 digest for evidence artifact',
            '  whoami / uname -a          Display current operator & target kernel info',
            '  ps aux                     List active processes on target host',
            '  netstat -antp              Show active TCP/UDP network connections',
            '  journalctl                 Inspect recent system service logs',
            '  volatility <pslist|netscan> Run memory forensics plugin (alias: vol.py)',
            '  edr isolate <host>         Network-isolate compromised host',
            '  edr kill <pid>             Terminate malicious process by PID',
            '  edr block <ip/domain>      Block malicious IOC at perimeter firewall',
            '  clear                      Clear terminal screen'
          ]);
        } else if (cmd === 'clear') {
          setTermHistory([]);
        } else if (cmd === 'whoami') {
          pushOut([operatorHandle || 'operator']);
        } else if (cmd === 'uname') {
          pushOut([`Linux ${activeRoom.id.toLowerCase()}-node 6.5.0-44-generic #44~22.04.1-Ubuntu SMP x86_64 GNU/Linux`]);
        } else if (cmd === 'ls') {
          const files = Object.keys(activeRoom.vfs || {});
          pushOut(files.length ? files : ['(No mounted files in this room)']);
        } else if (cmd === 'find') {
          const q = (parts[parts.length - 1] || '').replace(/[*"]/g, '').toLowerCase();
          const hits = Object.keys(activeRoom.vfs || {}).filter((f) => f.toLowerCase().includes(q));
          pushOut(hits.length ? hits : ['(No matching files found)']);
        } else if (cmd === 'cat') {
          if (activeRoom.vfs?.[arg1]) {
            pushOut(activeRoom.vfs[arg1].split('\n'));
          } else {
            pushOut([`cat: ${arg1 || '<file>'}: No such file in target filesystem`]);
          }
        } else if (cmd === 'head' || cmd === 'tail') {
          const targetFile = arg1 === '-n' ? parts[3] : arg1;
          const count = arg1 === '-n' ? Math.max(1, Number(arg2) || 10) : 10;
          if (activeRoom.vfs?.[targetFile]) {
            const lines = activeRoom.vfs[targetFile].split('\n');
            pushOut(cmd === 'head' ? lines.slice(0, count) : lines.slice(-count));
          } else {
            pushOut([`${cmd}: ${targetFile || '<file>'}: No such file in target filesystem`]);
          }
        } else if (cmd === 'wc') {
          const targetFile = arg1 === '-l' ? arg2 : arg1;
          if (activeRoom.vfs?.[targetFile]) {
            const lineCount = activeRoom.vfs[targetFile].split('\n').length;
            pushOut([`${lineCount} ${targetFile}`]);
          } else {
            pushOut([`wc: ${targetFile || '<file>'}: No such file`]);
          }
        } else if (cmd === 'grep' || cmd === 'awk') {
          const m = raw.match(/^(?:grep|awk)\s+(?:-[a-zA-Z]+\s+)?["']?([^"'\s]+)["']?\s+(\S+)/i);
          if (m && activeRoom.vfs?.[m[2]]) {
            const cleanPat = m[1].replace(/^\/|\/$/g, '').toLowerCase();
            const hits = activeRoom.vfs[m[2]]
              .split('\n')
              .filter((l) => l.toLowerCase().includes(cleanPat));
            pushOut(hits.length ? hits : ['(No matching lines)']);
          } else {
            pushOut([`Usage: ${cmd} <pattern> <filepath>`]);
          }
        } else if (cmd === 'strings') {
          if (activeRoom.vfs?.[arg1]) {
            pushOut(activeRoom.vfs[arg1].split('\n'));
          } else {
            pushOut([`strings: '${arg1 || '<file>'}': No such file`]);
          }
        } else if (cmd === 'echo' && raw.includes('|') && raw.toLowerCase().includes('base64')) {
          const pipeMatch = raw.match(/echo\s+["']?([^"'\s|]+)["']?\s*\|\s*base64\s+-d/i);
          if (pipeMatch) {
            try {
              pushOut([atob(pipeMatch[1]).replace(/\u0000/g, '')]);
            } catch {
              pushOut(['base64: invalid input']);
            }
          } else {
            pushOut(['Usage: echo "<base64>" | base64 -d']);
          }
        } else if (cmd === 'base64' && (arg1 === '-d' || arg1 === '--decode')) {
          const b64Str = parts.slice(2).join('').replace(/["']/g, '');
          try {
            pushOut([atob(b64Str).replace(/\u0000/g, '')]);
          } catch {
            pushOut(['base64: invalid input']);
          }
        } else if (cmd === 'xxd') {
          const hexStr = parts[parts.length - 1].replace(/[^0-9a-fA-F]/g, '');
          if (hexStr && hexStr.length % 2 === 0) {
            let out = '';
            for (let i = 0; i < hexStr.length; i += 2) {
              out += String.fromCharCode(parseInt(hexStr.substr(i, 2), 16));
            }
            pushOut([out]);
          } else {
            pushOut(['Usage: xxd -r -p <even-length-hex-string>']);
          }
        } else if (cmd === 'sha256sum') {
          if (activeRoom.vfs?.[arg1]) {
            const knownHash =
              arg1.includes('nv_sync') || activeRoom.id === 'RM-201' || activeRoom.id === 'RM-401'
                ? '8f434346648f6b96df89dda901c5176b10a6d83961dd3c1ac88b59b2dc327aa4'
                : 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855';
            pushOut([`${knownHash}  ${arg1}`]);
          } else {
            pushOut([`sha256sum: ${arg1 || '<file>'}: No such file`]);
          }
        } else if (cmd === 'ps') {
          pushOut((activeRoom.psOutput || 'PID 1024 systemd').split('\n'));
        } else if (cmd === 'netstat') {
          pushOut((activeRoom.netstatOutput || 'No active sockets').split('\n'));
        } else if (cmd === 'journalctl') {
          pushOut((activeRoom.siemLogs || []).map((l) => `${l.time} ${l.host} ${l.source}: ${l.details}`));
        } else if (cmd === 'volatility' || cmd === 'vol.py') {
          const plugin = parts.find((p) => p === 'pslist' || p === 'netscan' || p === 'malfind') || arg1;
          if (plugin === 'pslist' || plugin === 'malfind') {
            pushOut((activeRoom.vfs?.['/evidence/memdump.txt'] || activeRoom.psOutput || '').split('\n'));
          } else if (plugin === 'netscan') {
            pushOut((activeRoom.netstatOutput || '').split('\n'));
          } else {
            pushOut(['Usage: volatility <pslist | netscan | malfind>']);
          }
        } else if (cmd === 'edr') {
          const sub = arg1.toLowerCase();
          if (sub === 'isolate' && arg2) {
            const h = arg2.toUpperCase();
            const nextIso = [...new Set([...isolatedHosts, h])];
            setIsolatedHosts(nextIso);
            const lines = [`[+] EDR Host Isolation Applied: ${h} -> Token: CONTAINED-${h}`];
            if (
              activeRoom.id === 'RM-401' &&
              nextIso.includes('VAULT-DB-01') &&
              killedPids.includes(7740) &&
              blockedIocs.includes('192.0.2.175')
            ) {
              lines.push('[+] MASTER CONTAINMENT COMPLETE: FULL-CONTAINMENT-VAULT-DB-01-7740-192.0.2.175');
            }
            pushOut(lines);
          } else if (sub === 'kill' && arg2) {
            const p = Number(arg2);
            const nextKill = [...new Set([...killedPids, p])];
            setKilledPids(nextKill);
            const lines = [`[+] EDR Process Terminated: PID ${p} -> Token: KILLED-${p}`];
            if (
              activeRoom.id === 'RM-401' &&
              isolatedHosts.includes('VAULT-DB-01') &&
              nextKill.includes(7740) &&
              blockedIocs.includes('192.0.2.175')
            ) {
              lines.push('[+] MASTER CONTAINMENT COMPLETE: FULL-CONTAINMENT-VAULT-DB-01-7740-192.0.2.175');
            }
            pushOut(lines);
          } else if (sub === 'block' && arg2) {
            const nextBlock = [...new Set([...blockedIocs, arg2])];
            setBlockedIocs(nextBlock);
            const lines = [`[+] Perimeter Firewall IOC Blocked: ${arg2} -> Token: BLOCKED-${arg2}`];
            if (
              activeRoom.id === 'RM-401' &&
              isolatedHosts.includes('VAULT-DB-01') &&
              killedPids.includes(7740) &&
              nextBlock.includes('192.0.2.175')
            ) {
              lines.push('[+] MASTER CONTAINMENT COMPLETE: FULL-CONTAINMENT-VAULT-DB-01-7740-192.0.2.175');
            }
            pushOut(lines);
          } else {
            pushOut(['Usage: edr <isolate|kill|block> <target>']);
          }
        } else {
          pushOut([`bash: ${cmd}: command not found. Type "help" to list supported utilities.`]);
        }
      };

      // Run Sigma Detection Simulation against Room Telemetry
      const handleRunSigma = () => {
        const logs = activeRoom.siemLogs || [];
        const pat = sigmaPattern.trim().toLowerCase();
        if (!pat) return;

        const matchedLogs = logs.filter((l) => {
          const targetText =
            sigmaField === 'details'
              ? l.details
              : sigmaField === 'eventId'
              ? l.eventId
              : sigmaField === 'source'
              ? l.source
              : JSON.stringify(l.raw);
          return targetText.toLowerCase().includes(pat);
        });

        const expected = activeRoom.sigmaTarget?.expectedSubstrings || [];
        const validLogic = expected.some((sub) => pat.includes(sub.toLowerCase())) && matchedLogs.length > 0;

        setSigmaResult({
          matchedCount: matchedLogs.length,
          matchedLogs,
          validLogic,
          flag: validLogic ? `FLAG{SIGMA_DEPLOYED_${activeRoom.id.replace('-', '')}}` : null
        });
      };

      // Quick Containment Action Buttons in Tab 4
      const triggerQuickContainment = (type, value) => {
        if (type === 'isolate') {
          const h = value.toUpperCase();
          setIsolatedHosts((p) => [...new Set([...p, h])]);
        } else if (type === 'kill') {
          setKilledPids((p) => [...new Set([...p, Number(value)])]);
        } else if (type === 'block') {
          setBlockedIocs((p) => [...new Set([...p, value])]);
        }
      };

      const fullCapstoneContained =
        activeRoom.id === 'RM-401' &&
        isolatedHosts.includes('VAULT-DB-01') &&
        killedPids.includes(7740) &&
        blockedIocs.includes('192.0.2.175');

      // Threat Intel Lookup
      const handleLookupIoc = () => {
        const clean = iocQuery.trim().replace(/\[\.\]/g, '.');
        if (!clean) return;
        const hit = THREAT_INTEL_DB[clean];
        setIocResult(
          hit
            ? { indicator: clean, ...hit }
            : {
                indicator: clean,
                type: 'Unknown',
                reputation: 'No Malicious Hits (0/100)',
                asn: 'Unindexed',
                family: 'None',
                mitre: 'N/A',
                summary: 'No malicious threat intelligence hits found in CyberOps TI feed.'
              }
        );
      };

      // Filtered SIEM logs
      const filteredLogs = useMemo(() => {
        const logs = activeRoom.siemLogs || [];
        return logs.filter((l) => {
          if (siemSeverityFilter !== 'ALL' && l.severity !== siemSeverityFilter) return false;
          if (!siemSearch.trim()) return true;
          const q = siemSearch.toLowerCase();
          return (
            l.details.toLowerCase().includes(q) ||
            l.eventId.toLowerCase().includes(q) ||
            l.source.toLowerCase().includes(q) ||
            l.host.toLowerCase().includes(q) ||
            JSON.stringify(l.raw).toLowerCase().includes(q)
          );
        });
      }, [activeRoom, siemSearch, siemSeverityFilter]);

      const enterRoom = (roomId) => {
        setActiveRoomId(roomId);
        setActiveView('lab');
      };

      const nextRecommendedRoom = useMemo(() => {
        return ROOMS.find((r) => !stats.completedRooms.includes(r.id)) || ROOMS[0];
      }, [stats.completedRooms]);

      return (
        <div className="min-h-screen bg-[#090d16] text-slate-200 font-sans flex flex-col selection:bg-[#00e5a0]/30">

              </div>

              <div className="bg-[#111827] border border-slate-800 rounded-2xl p-5 space-y-3">
                <h2 className="text-sm font-bold text-slate-100">CyberChef-Lite Decoder</h2>
                <select
                  value={chefOp}
                  onChange={(e) => setChefOp(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200"
                >
                  <option value="b64_decode">Base64 Decode</option>
                  <option value="b64_encode">Base64 Encode</option>
                  <option value="hex_decode">Hex Decode</option>
                  <option value="url_decode">URL Decode</option>
                  <option value="rot13">ROT13</option>
                  <option value="xor">Single-Byte XOR</option>
                </select>
                <textarea
                  rows={3}
                  value={chefInput}
                  onChange={(e) => setChefInput(e.target.value)}
                  placeholder="Paste text to transform..."
                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 font-mono text-xs text-slate-200"
                />
                <div className="bg-slate-950 border border-slate-800 rounded-lg p-3 font-mono text-xs text-[#00e5a0] min-h-[70px] whitespace-pre-wrap break-all">
                  {chefOutput || 'Output will appear here...'}
                </div>
              </div>

              <div className="bg-[#111827] border border-slate-800 rounded-2xl p-5 space-y-3">
                <h2 className="text-sm font-bold text-slate-100">Threat Intelligence IOC Lookup</h2>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={iocQuery}
                    onChange={(e) => setIocQuery(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleLookupIoc()}
                    placeholder="Try 192.0.2.175, 203.0.113.84, or tunnel-dns.example.org..."
                    className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 font-mono text-xs text-slate-100"
                  />
                  <button
                    onClick={handleLookupIoc}
                    className="px-4 py-2 rounded-lg bg-[#38bdf8] hover:bg-sky-300 text-slate-950 font-bold text-xs cursor-pointer"
                  >
                    Lookup
                  </button>
                </div>
                {iocResult && (
                  <div className="bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs space-y-1">
                    <div className="font-mono text-[#00e5a0] font-bold">{iocResult.reputation} — {iocResult.family}</div>
                    <p className="text-slate-300">{iocResult.summary}</p>
                  </div>
                )}
              </div>
            </main>
          )}

          {/* ROOM COMPLETION CERTIFICATE / DEBRIEF MODAL */}
          {certModalRoom && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#111827] border-2 border-[#00e5a0] rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-mono uppercase tracking-widest text-[#00e5a0]">
                    CyberOps Range • Room Debrief
                  </span>
                  <Award className="w-6 h-6 text-[#00e5a0]" />
                </div>

                <div>
                  <h2 className="text-xl font-bold text-slate-100">Room Completed: {certModalRoom.title}</h2>
                  <p className="text-xs text-slate-400 mt-1">
                    Issued to <strong className="text-slate-200 font-mono">{operatorHandle}</strong> • +{certModalRoom.xp} XP Earned
                  </p>
                </div>

                <div className="bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-xs space-y-2">
                  <div className="font-mono text-[#38bdf8]">MITRE ATT&amp;CK Techniques Investigated &amp; Mitigated:</div>
                  <div className="flex flex-wrap gap-1.5">
                    {certModalRoom.mitre.map((m) => (
                      <span key={m} className="px-2 py-0.5 rounded bg-[#00e5a0]/15 text-[#00e5a0] font-mono">
                        {m}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="flex flex-wrap justify-end gap-2 pt-2">
                  <button
                    onClick={() => setCertModalRoom(null)}
                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 cursor-pointer"
                  >
                    Close
                  </button>
                  <button
                    onClick={() => {
                      const idx = ROOMS.findIndex((r) => r.id === certModalRoom.id);
                      const next = ROOMS[idx + 1] || ROOMS[0];
                      setCertModalRoom(null);
                      enterRoom(next.id);
                    }}
                    className="px-4 py-2 rounded-xl bg-[#00e5a0] hover:bg-[#00c98d] text-slate-950 text-xs font-bold flex items-center gap-1.5 cursor-pointer"
                  >
                    Next Room in Path <ArrowRight className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
